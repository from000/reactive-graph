name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: JavaScript (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve through "main": "dist/index.js", and dist/
      # is git-ignored, so the build must run before typecheck/test.
      - name: Build workspace packages
        run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Dependency audit
        run: pnpm audit --prod

  python:
    name: Python (3.10, 3.11, 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Driver-backed tests spawn packages/driver/dist/main.js; build it first
      # or those suites fail with "driver process exited".
      - name: Build Driver
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lockfile check
        run: uv lock --check
      - name: Install test deps
        run: uv sync --directory python/reactivegraph --extra test
      - name: Run tests
        run: uv run --directory python/reactivegraph pytest -q
      - name: Ruff
        run: uvx ruff check python/reactivegraph
      - name: mypy
        run: uvx mypy python/reactivegraph/reactivegraph
      - name: Dependency audit
        run: uvx pip-audit

  reactivechain:
    name: ReactiveChain Python (3.10, 3.11, 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build Driver
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: uv sync --directory python/reactivechain --extra test
      - name: Run tests
        run: uv run --directory python/reactivechain --extra test pytest -q
      - name: Ruff
        run: uvx ruff check python/reactivechain
      - name: mypy
        run: uvx mypy python/reactivechain/reactivechain
      - name: Tutorial scripts
        run: python scripts/check-tutorials.py

  clean-install:
    name: Clean install (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Python 3.10
            python-version: "3.10"
            script: ./scripts/check-clean-install.sh --python-only
          - label: Python 3.11
            python-version: "3.11"
            script: ./scripts/check-clean-install.sh --python-only
          - label: Python 3.12
            python-version: "3.12"
            script: ./scripts/check-clean-install.sh --python-only
          - label: npm
            node-only: true
            script: ./scripts/check-clean-install.sh --js-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: ${{ !matrix.node-only }}
      - uses: actions/setup-python@v5
        if: ${{ !matrix.node-only }}
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pnpm/action-setup@v4
        if: ${{ matrix.node-only }}
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        if: ${{ matrix.node-only }}
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        if: ${{ matrix.node-only }}
        run: pnpm install --frozen-lockfile
      - run: ${{ matrix.script }}

  coverage:
    name: Coverage gate (TS driver + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r build
      - name: TS driver coverage (thresholds in packages/driver/vitest.config.ts)
        run: pnpm --filter @reactivegraph/driver test --coverage
      - uses: astral-sh/setup-uv@v5
      - name: Python coverage (fail under 80%)
        run: |
          uv run --directory python/reactivegraph --with pytest --with pytest-asyncio --with msgpack --with pytest-cov \
            pytest -p no:cacheprovider --cov=reactivegraph --cov-report=term --cov-fail-under=80

  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Tutorial 07 runs against the real Driver; build it before checking.
      - name: Build Driver
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
      - uses: astral-sh/setup-uv@v5
      - name: Tutorial code check (01-03, 07-08; 04-06 require the bundled Driver)
        run: python scripts/check-tutorials.py
      - name: Markdown link check (relative links must resolve)
        run: python scripts/check-docs.py


  docs-site:
    name: Docs site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install mkdocs
      - run: pipx inject mkdocs mkdocs-material
      - run: mkdocs build --strict
