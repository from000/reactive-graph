[project]
name = "deerflow-example"
version = "0.1.0"
description = "DeerFlow-style SuperAgent on the native ReactiveGraph API (M3 verification)"
requires-python = ">=3.11"
dependencies = [
    "reactivegraph>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-playwright>=0.5"]

[tool.uv.sources]
reactivegraph = { path = "../../python/reactivegraph" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
