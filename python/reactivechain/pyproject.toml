[project]
name = "reactivechain"
version = "0.1.0"
description = "ReactiveChain — declarative pipeline components on the ReactiveGraph engine"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
authors = [
    { name = "ReactiveGraph contributors" },
]
keywords = ["reactive", "reactivechain", "langchain", "pipeline", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "reactivegraph>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reactivechain"]

[tool.uv.sources]
reactivegraph = { workspace = true }

[project.urls]
Homepage = "https://github.com/from000/reactive-graph"
Repository = "https://github.com/from000/reactive-graph"
Issues = "https://github.com/from000/reactive-graph/issues"
Documentation = "https://github.com/from000/reactive-graph/tree/main/docs"

[project.optional-dependencies]
test = [
    "langgraph==1.2.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pydantic>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.interrogate]
# Docstring coverage gate. Nested functions, overload stubs, __init__ and
# magic methods are excluded: they are implementation details, not the API
# surface users read.
ignore-nested-functions = true
ignore-overloaded-functions = true
ignore-init-method = true
ignore-magic = true
fail-under = 80
