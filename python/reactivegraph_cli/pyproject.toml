[project]
name = "reactivegraph-cli"
version = "0.1.0"
description = "ReactiveGraph CLI: project validation, local Driver dev, trace export, deploy artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "reactivegraph>=0.1.0",
]

[tool.uv.sources]
reactivegraph = { workspace = true }

[project.urls]
Homepage = "https://github.com/from000/reactive-graph"
Repository = "https://github.com/from000/reactive-graph"
Issues = "https://github.com/from000/reactive-graph/issues"
Documentation = "https://github.com/from000/reactive-graph/tree/main/docs"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
reactivegraph = "reactivegraph_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"